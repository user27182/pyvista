name: Windows child hang stress

on:
  push:
    branches: ["debug/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: stress ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, lp0, nocache]
        rep: [1, 2, 3]
    env:
      CI_WINDOWS: true
      PYVISTA_PLOT_THEME: testing
      STRESS_ITERS: "1000"
      STRESS_BUDGET_MIN: "40"
      STRESS_WORKERS: "3"
      LP_NUM_THREADS: ${{ matrix.variant == 'lp0' && '0' || '' }}
      MESA_SHADER_CACHE_DISABLE: ${{ matrix.variant == 'nocache' && 'true' || '' }}
      _NT_SYMBOL_PATH: srv*C:\symbols*https://msdl.microsoft.com/download/symbols
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e

      - name: Install
        run: |
          pip install uv
          uv pip install --system . --group pinned py-spy psutil

      - name: Install cdb
        continue-on-error: true
        timeout-minutes: 8
        run: |
          choco install windbg -y --no-progress || true
          ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/" | head || true

      - name: Report
        run: python -m pyvista report

      - name: Stress
        run: python stress_child_hang.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.variant }}-r${{ matrix.rep }}
          path: stress_results/
          if-no-files-found: ignore
